<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مسیح استوک | فروشگاه اینترنتی</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">مسیح <span>استوک</span></div>

    <nav>
        <a href="#">صفحه اصلی</a>
        <a href="#products">محصولات</a>
        <a href="#about">درباره ما</a>
        <a href="#contact">تماس با ما</a>
    </nav>

    <button class="cart">🛒 سبد خرید</button>
</header>

<section class="hero">
    <div>
        <h1>به فروشگاه مسیح استوک خوش آمدید</h1>

    </div>
</section>

<section id="products">
    <h2>محصولات فروشگاه</h2>

    <div class="products">

            <img src="https://placehold.co/300x220?text=iPhone" alt="آیفون">

            <p>مشاهده مدل‌های مختلف آیفون</p>
            <button>مشاهده محصول</button>
        </div>

        <div class="product">
            <img src="https://placehold.co/300x220?text=Laptop" alt="لپ‌تاپ">
            <h3>لپ‌تاپ استوک</h3>
            <p>انواع لپ‌تاپ با کیفیت مناسب</p>
            <button>مشاهده محصول</button>
        </div>
    </div>
</section>

<footer id="about">
    <h3>مسیح استوک</h3>
    <p id="contact">انتخاب هوشمندانه، خرید مطمئن</p>
</footer>

</html>
